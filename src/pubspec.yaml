name: durus
description: "Durus (دروس) — private-lessons management: students, schedule, attendance, variable monthly fees, progress, parent portal."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: 2.17.1   # exact pin — 2.17.2+ pulls jni → needs android-35 SDK (unavailable on this machine)
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# path_provider_android 2.3.x pulls the jni/jni_flutter native-assets chain,
# which hardcodes compileSdk 35 (not installable on this filtered network).
# Pin the last pre-jni implementation (2.2.x) to keep Android builds working.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Reem Kufi (variable font) — display numerals + headings (فسيفساء & سكون)
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Variable.ttf
          weight: 400
        - asset: assets/fonts/ReemKufi-Variable.ttf
          weight: 500
        - asset: assets/fonts/ReemKufi-Variable.ttf
          weight: 700
        - asset: assets/fonts/ReemKufi-Variable.ttf
          weight: 800
    # Tajawal — body text (فسيفساء)
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    # IBM Plex Sans Arabic — data/leading figures (سكون)
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600